<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">MicroSystem system architecture</title>
  <desc id="desc">A layered architecture from QEMU AArch64 hardware through the EL1 microkernel and isolated EL0 services to Mica applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071326"/>
      <stop offset="1" stop-color="#12233e"/>
    </linearGradient>
    <linearGradient id="kernel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3b63"/>
      <stop offset="1" stop-color="#28568d"/>
    </linearGradient>
    <linearGradient id="service" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17334d"/>
      <stop offset="1" stop-color="#1e4960"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b2e67"/>
      <stop offset="1" stop-color="#5a3f8c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#82b9ff"/>
    </marker>
    <style>
      .label { font: 600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #f4f8ff; }
      .small { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #b9c9df; }
      .tiny { font: 400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #9cb1cc; }
      .box-title { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #ffffff; }
      .box-text { font: 400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #d8e5f5; }
      .mono { font: 500 14px ui-monospace,SFMono-Regular,Menlo,monospace; fill: #e5efff; }
    </style>
  </defs>

  <rect width="1400" height="930" rx="28" fill="url(#bg)"/>
  <path d="M0 170 H1400 M0 410 H1400 M0 735 H1400" stroke="#28415f" stroke-width="1" opacity=".55"/>
  <text x="70" y="70" class="label" font-size="30">MicroSystem · layered capability architecture</text>
  <text x="70" y="103" class="small">AArch64 research OS · QEMU virt-7.2 · mechanisms in EL1, policy in isolated EL0 services</text>

  <text x="70" y="151" class="tiny" letter-spacing="2">HARDWARE PROFILE</text>
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="1260" height="150" rx="18" fill="#13243b" stroke="#34567e" stroke-width="2"/>
    <rect x="100" y="215" width="205" height="80" rx="12" fill="#1b3351"/>
    <text x="125" y="247" class="box-title">QEMU virt-7.2</text>
    <text x="125" y="272" class="box-text">2 CPUs · 256 MiB RAM</text>
    <rect x="335" y="215" width="205" height="80" rx="12" fill="#1b3351"/>
    <text x="360" y="247" class="box-title">VirtIO</text>
    <text x="360" y="272" class="box-text">block · net · GPU · input</text>
    <rect x="570" y="215" width="205" height="80" rx="12" fill="#1b3351"/>
    <text x="595" y="247" class="box-title">Interrupt / DMA</text>
    <text x="595" y="272" class="box-text">GICv3 · SMMUv3 · PCIe</text>
    <rect x="805" y="215" width="205" height="80" rx="12" fill="#1b3351"/>
    <text x="830" y="247" class="box-title">Firmware data</text>
    <text x="830" y="272" class="box-text">DTB · PL031 · UART</text>
    <rect x="1040" y="215" width="260" height="80" rx="12" fill="#1b3351"/>
    <text x="1065" y="247" class="box-title">AArch64</text>
    <text x="1065" y="272" class="box-text">4 KiB pages · EL1/EL0</text>
  </g>

  <path d="M700 330 V382" stroke="#82b9ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="720" y="363" class="tiny">hardware mechanisms only</text>

  <text x="70" y="402" class="tiny" letter-spacing="2">EL1 TRUSTED CORE</text>
  <g filter="url(#shadow)">
    <rect x="70" y="430" width="1260" height="220" rx="18" fill="url(#kernel)" stroke="#5f9ee7" stroke-width="2"/>
    <text x="105" y="470" class="box-title" font-size="23">Microkernel · minimal trusted computing base</text>
    <text x="105" y="498" class="box-text">Boot, MMU, scheduling, capability enforcement, IPC, IRQ routing, IOMMU setup, W^X ELF loading, resource limits</text>
    <rect x="105" y="530" width="250" height="76" rx="10" fill="#214a78"/>
    <text x="130" y="560" class="box-title">Memory &amp; tasks</text>
    <text x="130" y="584" class="box-text">MMU · ASID · scheduler</text>
    <rect x="380" y="530" width="250" height="76" rx="10" fill="#214a78"/>
    <text x="405" y="560" class="box-title">IPC &amp; capabilities</text>
    <text x="405" y="584" class="box-text">derive · revoke · endpoints</text>
    <rect x="655" y="530" width="250" height="76" rx="10" fill="#214a78"/>
    <text x="680" y="560" class="box-title">Device boundary</text>
    <text x="680" y="584" class="box-text">DTB · PCI · IRQ · SMMU</text>
    <rect x="930" y="530" width="365" height="76" rx="10" fill="#214a78"/>
    <text x="955" y="560" class="box-title">EL0 launch &amp; cleanup</text>
    <text x="955" y="584" class="box-text">static ELF bootfs · W^X · bounded slots</text>
  </g>

  <path d="M700 650 V702" stroke="#82b9ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="720" y="684" class="tiny">authenticated endpoint IPC + capability grants</text>

  <text x="70" y="722" class="tiny" letter-spacing="2">EL0 POLICY SERVICES AND APPLICATIONS</text>
  <g filter="url(#shadow)">
    <rect x="70" y="750" width="850" height="130" rx="18" fill="url(#service)" stroke="#4f9aab" stroke-width="2"/>
    <text x="100" y="785" class="box-title">Isolated EL0 services</text>
    <text x="100" y="812" class="mono">init · console · devmgr · block · MFS1 · shell · netd · sshd</text>
    <text x="100" y="840" class="mono">windowd · terminal · files · monitor</text>
    <text x="100" y="866" class="box-text">Storage, network, SSH, and GUI policy live here — not in the kernel.</text>

    <rect x="955" y="750" width="375" height="130" rx="18" fill="url(#app)" stroke="#a88bea" stroke-width="2"/>
    <text x="985" y="785" class="box-title">Mica application layer</text>
    <text x="985" y="812" class="mono">Counter · Reader · Editor</text>
    <text x="985" y="838" class="mono">Terminal · user scripts</text>
    <text x="985" y="866" class="box-text">manifest ∩ launcher ∩ entry policy</text>
  </g>

  <path d="M920 815 H950" stroke="#82b9ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="933" y="802" class="tiny" text-anchor="middle">brokers</text>

  <text x="70" y="912" class="tiny">Blue arrows: controlled downward capability flow · Rounded boxes: independently testable boundaries</text>
</svg>
