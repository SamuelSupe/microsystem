[package]
name = "microsystem-netd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "../user-build.rs"

[dependencies]
microsystem-abi = { path = "../../crates/abi" }
microsystem-identity = { path = "../../crates/identity" }
microsystem-user-rt = { path = "../../crates/user-rt", optional = true, features = ["large-heap"] }
smoltcp = { version = "0.13.1", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "proto-ipv6",
    "proto-ipv6-slaac",
    "proto-dhcpv4",
    "proto-dns",
    "socket-tcp",
    "socket-udp",
    "socket-dns",
    "socket-dhcpv4",
    "iface-max-addr-count-8",
    "iface-max-route-count-4",
    "iface-neighbor-cache-count-8",
] }

[features]
default = []
user-bin = ["dep:microsystem-user-rt"]

[[bin]]
name = "microsystem-netd"
path = "src/main.rs"
test = false
bench = false
required-features = ["user-bin"]
