[package]
name = "microsystem-db"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "../user-build.rs"

[dependencies]
microsystem-abi = { path = "../../crates/abi" }
microsystem-sql = { path = "../../crates/sql", default-features = false }
microsystem-user-rt = { path = "../../crates/user-rt", optional = true, features = ["large-heap"] }

[features]
default = []
user-bin = ["dep:microsystem-user-rt"]

[[bin]]
name = "microsystem-db"
path = "src/main.rs"
test = false
bench = false
required-features = ["user-bin"]
