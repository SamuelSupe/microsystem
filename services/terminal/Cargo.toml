[package]
name = "microsystem-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "../user-build.rs"

[dependencies]
microsystem-abi = { path = "../../crates/abi" }
microsystem-identity = { path = "../../crates/identity" }
microsystem-fs = { path = "../fs" }
microsystem-shell = { path = "../shell" }
microsystem-user-rt = { path = "../../crates/user-rt", optional = true }

[features]
default = []
user-bin = ["dep:microsystem-user-rt", "microsystem-shell/user-bin"]

[[bin]]
name = "microsystem-terminal"
path = "src/main.rs"
test = false
bench = false
required-features = ["user-bin"]
